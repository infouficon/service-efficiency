services:
  mysql:
    image: mysql:8.4
    ports:
      - '127.0.0.1:3307:3306'
    environment:
      MYSQL_DATABASE: service_efficiency
      MYSQL_USER: service_efficiency
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
